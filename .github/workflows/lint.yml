name: Lint Scripts

on:
  push:
    paths:
      - "Scripts/**"
      - "Scripts/Installers/install.sh"
      - "Scripts/Installers/install.ps1"
  pull_request:
    paths:
      - "Scripts/**"
      - "Scripts/Installers/install.sh"
      - "Scripts/Installers/install.ps1"

jobs:
  bash-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax-check all bash scripts
        run: |
          set -e
          for f in install.sh Scripts/*.sh; do
            echo "Checking $f"
            bash -n "$f"
          done

  python-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Byte-compile all Python scripts
        run: |
          set -e
          for f in Scripts/*.py; do
            echo "Checking $f"
            python3 -m py_compile "$f"
          done

  powershell-parse:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse-check all PowerShell scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $files = @("Scripts/Installers/install.ps1") + (Get-ChildItem -Path Scripts -Filter *.ps1 | ForEach-Object { $_.FullName })
          $failed = $false
          foreach ($f in $files) {
            $nullTokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f, [ref]$nullTokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              Write-Host "FAILED: $f"
              $errors | ForEach-Object { Write-Host "  $($_.Message)" }
              $failed = $true
            } else {
              Write-Host "OK: $f"
            }
          }
          if ($failed) { exit 1 }

  runtime-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build fixture vault
        run: |
          set -e
          mkdir -p /tmp/hermes-brain-fixture
          python3 Scripts/ci/build_fixture_vault.py /tmp/hermes-brain-fixture
      - name: Install fake hermes CLI on PATH
        run: |
          set -e
          mkdir -p /tmp/fakebin
          cp Scripts/ci/fake_hermes.sh /tmp/fakebin/hermes
          chmod +x /tmp/fakebin/hermes
          echo "/tmp/fakebin" >> "$GITHUB_PATH"
      - name: Run vault_audit.py against fixture
        env:
          HERMES_VAULT_PATH: /tmp/hermes-brain-fixture
        run: |
          set -e
          python3 Scripts/vault_audit.py
          test -f /tmp/hermes-brain-fixture/Skills-Notes/Vault-Audit-Report.md
          echo "vault_audit.py: OK, report generated"
      - name: Run agent_performance.py against fixture
        env:
          HERMES_VAULT_PATH: /tmp/hermes-brain-fixture
        run: |
          set -e
          python3 Scripts/agent_performance.py
          test -f /tmp/hermes-brain-fixture/Skills-Notes/Agent-Performance.md
          echo "agent_performance.py: OK, report generated"
      - name: Run hourly_archive.py against fixture (no-new-sessions path)
        env:
          HERMES_VAULT_PATH: /tmp/hermes-brain-fixture
        run: |
          set -e
          python3 Scripts/hourly_archive.py
          echo "hourly_archive.py: OK, exited cleanly"
      - name: Run generate_skill_links.py against fixture
        run: |
          set -e
          python3 Scripts/generate_skill_links.py /tmp/hermes-brain-fixture
          test -f /tmp/hermes-brain-fixture/Skills-Notes/Skill-to-Chat-Links.md
          echo "generate_skill_links.py: OK, report generated"
      # pull_supermemory.py and trend_digest.py are intentionally NOT
      # smoke-tested here: pull_supermemory.py requires a real/mocked
      # Supermemory API + key (network I/O, not just file I/O like the
      # scripts above), and trend_digest.py requires sentence-transformers
      # (a heavy ML dependency not worth adding to this lint job). Both
      # remain candidates for their own dedicated CI job if that becomes
      # worthwhile — see issue tracker.

  consolidate-memory-content-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run consolidate_memory.py content-correctness tests
        run: |
          set -e
          python3 Scripts/ci/test_consolidate_memory.py
